# fr-cli 默认厂商配置
# compat 字段表示 API 协议兼容模式：
#   openai    → OpenAI 兼容协议（默认）
#   anthropic → Anthropic Messages 协议
#   zhipu     → 智谱原生 SDK
# client 字段仍然保留，作为显式客户端类覆盖（默认按 compat 推断）
# env_key 表示该厂商 API Key 对应的环境变量名（仅作提示，不强制读取）

zhipu:
  name: 智谱
  model: glm-4-flash
  image_model: cogview-3-plus
  models:
  - glm-4-flash
  - glm-4-plus
  - glm-4
  - glm-4v-plus
  - glm-4-air
  - glm-4-long
  client: ZhipuLLMClient
  compat: zhipu
  base_url: null
  token_plan_base_url: https://open.bigmodel.cn/api/coding/paas/v4
  is_token_plan: false
  env_key: ZHIPU_API_KEY
  vision_models:
  - glm-4v-plus
  - glm-4v
  - glm-4v-flash
zhipu-coding:
  name: 智谱 GLM Coding Plan
  model: glm-4.7
  models:
  - glm-4.7
  - glm-5.1
  - glm-4.5-air
  client: OpenAICompatibleClient
  compat: openai
  base_url: https://open.bigmodel.cn/api/coding/paas/v4
  token_plan_base_url: https://open.bigmodel.cn/api/coding/paas/v4
  is_token_plan: true
  env_key: ZHIPU_API_KEY
