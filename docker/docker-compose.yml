# ================================================================
# 凡人打字机 (fr-cli) —— Docker Compose 配置
# ================================================================

services:
  fr-cli:
    build: .
    container_name: fr-cli
    # 交互式终端必须加上 stdin_open + tty
    stdin_open: true
    tty: true
    # 卷挂载：持久化所有配置与数据到宿主机
    volumes:
      # 统一配置根目录（包含 config.json、context.json、sessions、plugins、agents、master 等）
      - ~/.fr_cli:/root/.fr_cli
      # 工作目录（宿主机当前目录映射到容器 workspace）
      - .:/app/workspace
    # 如需暴露 Agent HTTP 服务，取消下行注释并指定端口
    # ports:
    #   - "8080:8080"
    # 环境变量（可选：首次运行也可在交互中输入）
    # environment:
    #   - ZHIPU_API_KEY=your-api-key-here
